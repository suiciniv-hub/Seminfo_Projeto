<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontEnd/css/style.css">
    <title>Cadastro seminfo</title>
</head>


<body data-page="cadastro">
    <header>
        <b>Seminfo 3.2</b>
        <a href="/frontEnd/login.html">Login</a>
    </header>
    <main>
        <section class="card">
            <form id="form-inscricao">
                <h2>Cadastrar no Sistema Seminfo</h2>
                <br>
                <label>Nome completo <input type="text" name="nome" required></label>

                <label>Idade <input type="number" name="idade" min="1" max="120" step="1" required></label>

                <label>Email <input type="email" name="email" required></label>

                <label>Senha <input type="password" name="senha" required></label>

                <label for="perfil">Perfil</label>
                <select name="perfil" id="perfil" required>
                    <option value="" hidden>Selecione um perfil </option>
                    <option value="Aluno">Aluno (Ouvinte)</option>
                    <option value="Professor">Professor (Apresentador)</option>
                    <option value="Externo">Externo (Ouvinte ou Apresentador)</option>
                </select>
                <div id="campos-aluno">
                    <label for="matricula">Matrícula </label>
                    <input type="text" id="matricula" required>

                    <label for="curso">Curso</label>
                    <select id="curso" required>
                        <option value="" hidden>Selecione um curso </option>
                        <option value="SI"> Sistemas de Informação</option>
                        <option value="GTI"> Gestão de TI</option>
                        <option value="TADS"> Tecnologia em Análise e Desenvolvimento de Sistemas</option>
                    </select>
                </div>
                <label for="instituicao">Instituição</label>
                <input type="text" id="instituicao" required>

                <br>
                <button type="submit">Inscrever</button>
            </form>
            <p id="mensagem"></p>
            <br>
            <a href="/frontEnd/login.html">Voltar ao login</a>
        </section>
    </main>
</body>

</html>
